[project]
name = "gotabiblioteken-hacs"
description = "Home Assistant integration for Götabiblioteken library opening hours"
# The integration's version lives in custom_components/gotabiblioteken/manifest.json.
version = "0"
requires-python = ">=3.13.2"
# Runtime requirements belong in manifest.json; Home Assistant installs those.
dependencies = []

[dependency-groups]
dev = [
    # Pulls in a matching Home Assistant pin as a dependency.
    "pytest-homeassistant-custom-component==0.13.316",
    "mypy==2.4.0",
    "ruff==0.17.2",
]

[tool.uv]
# Dev tooling only: HACS ships custom_components/, nothing here is built.
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.mypy]
python_version = "3.13"
strict = true
files = ["custom_components", "tests", "scripts", "conftest.py"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["tests.*", "conftest"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
# hass.states.get() returns State | None; a None here fails the test anyway.
disable_error_code = ["union-attr"]

[[tool.mypy.overrides]]
module = ["pytest_homeassistant_custom_component.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "BLE", "RUF"]
ignore = [
    "E501",    # line length is the formatter's job
    "RUF001",  # en dashes in hours ("10:00–19:00") are intentional
    "RUF002",  # ...also in docstrings and comments
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]
section-order = ["future", "standard-library", "third-party", "homeassistant", "first-party", "local-folder"]
force-sort-within-sections = true
combine-as-imports = true

[tool.ruff.lint.isort.sections]
homeassistant = ["homeassistant", "pytest_homeassistant_custom_component"]
