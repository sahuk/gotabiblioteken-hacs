name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match manifest version
        run: |
          version=$(jq -r .version custom_components/gotabiblioteken/manifest.json)
          if [ "${{ github.event.release.tag_name }}" != "v${version}" ]; then
            echo "::error::tag ${{ github.event.release.tag_name }} != v${version} from manifest.json"
            exit 1
          fi
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Checks
        run: |
          uv sync --locked
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
          uv run pytest
      - name: Build zip
        run: |
          mkdir dist
          cd custom_components/gotabiblioteken
          zip -r ../../dist/gotabiblioteken.zip . -x '__pycache__/*' '*.pyc'
      - name: Upload zip to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/gotabiblioteken.zip --clobber
