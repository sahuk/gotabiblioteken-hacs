name: Release

# Pushing a v<version> tag releases it. Checks and the build run with a
# read-only token; only the publish job, which runs no repo code, can write.
# `gh release create` with an asset creates a draft, uploads the zip and then
# publishes, so HACS never sees a release without its zip.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and all branches, so origin/master is available for
          # the reachability check below.
          fetch-depth: 0
          persist-credentials: false
      - name: Tag must match manifest version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(jq -r .version custom_components/gotabiblioteken/manifest.json)
          if [ "$TAG" != "v${version}" ]; then
            echo "::error::tag $TAG != v${version} from manifest.json"
            exit 1
          fi
      - name: Tagged commit must be on master
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::release commit $GITHUB_SHA is not reachable from master"
            exit 1
          fi
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Checks
        run: |
          uv sync --locked
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
          uv run scripts/type_coverage.py
          uv run pytest
      - name: Build zip and release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mkdir dist
          awk -v h="## [${TAG#v}]" 'index($0, h) == 1 {f = 1; next} /^## \[/ {f = 0} f' \
            CHANGELOG.md > dist/notes.md
          test -s dist/notes.md || { echo "::error::no CHANGELOG entry for $TAG"; exit 1; }
          cd custom_components/gotabiblioteken
          zip -r ../../dist/gotabiblioteken.zip . -x '__pycache__/*' '*.pyc'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: Publish release with zip
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/gotabiblioteken.zip \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" \
            --notes-file dist/notes.md
